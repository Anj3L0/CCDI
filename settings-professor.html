<body data-page="settings" data-role="professor">

    <header class="app-topbar"><button class="mobile-menu" onclick="toggleSidebar()" aria-label="Open navigation">☰</button><a class="brand" href="dashboard-professor.html"><img class="brand-logo" src="image/CCDI EDU.png" alt="CCDI EDU"><div><strong>CCDI EDU</strong><small>Computer Communication Development Institute</small></div></a><a class="profile-btn" href="profile.html" aria-label="Open profile"><span class="avatar">PS</span></a></header>
    <aside id="sidebar" class="sidebar"><div class="sidebar-role">PROFESSOR</div><a class="nav-item" data-page="dashboard"><span>Home</span></a><a class="nav-item" data-page="announcements"><span>Announcements</span></a><a class="nav-item" data-page="schedule"><span>Class Schedule</span></a><a class="nav-item" data-page="grades"><span>Grades</span></a><a class="nav-item" data-page="classes"><span>My Classes</span></a><a class="nav-item" data-page="events"><span>Events</span></a><a class="nav-item" data-page="settings"><span>Settings</span></a></aside>

  <div class="app-content static-page-content" id="settingsTemplate"><section class="page-title"><div><h1>Professor Settings</h1><p>Manage teaching and notification preferences.</p></div></section><div class="panel"><div class="form-grid"><div class="form-group"><label for="professorEmailNotifications">Email notifications</label><select id="professorEmailNotifications"><option>Enabled</option><option>Disabled</option></select></div><div class="form-group"><label for="themeSelect">Theme</label><select id="themeSelect"><option value="light">CCDI Blue / Light</option><option value="dark">Dark</option></select></div><div class="form-group"><label for="gradeReleaseNotifications">Grade release reminders</label><select id="gradeReleaseNotifications"><option>Enabled</option><option>Disabled</option></select></div></div><button class="btn btn-primary" style="margin-top:20px" onclick="saveSettings()">Save Settings</button></div></div>
